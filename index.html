<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PartStack">
  <meta name="theme-color" content="#eef1f7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <title>PartStack</title>
  <script>
    (function(){try{var q=new URLSearchParams(location.search).get('theme');if(q==='dark'||q==='light')localStorage.setItem('ps_theme',q);
      if((q||localStorage.getItem('ps_theme'))==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    /* Palette StockVault (clair par défaut, « sombre adouci » via <html data-theme="dark">).
       --accent = fonds pleins (boutons, sélection) · --on-acc = texte posé dessus · --acc-tx = accent utilisé comme texte. */
    :root {
      --bg:       #eef1f7;
      --card:     #FFFFFF;
      --card2:    #f8f9fc;
      --text:     #1a1f3a;
      --text2:    #5b6280;
      --text3:    #8b91ad;
      --border:   #e1e5ee;
      --border2:  #cdd2df;
      --accent:   #1a1f3a;
      --on-acc:   #FFFFFF;
      --acc-tx:   #1a1f3a;
      --acc-lt:   #eceff6;
      --hero:     linear-gradient(135deg, #1a1f3a 0%, #2d1b69 60%, #1e2d6b 100%);
      --ok-bg:    #ECFDF5; --ok-tx:  #059669;  --ok-bd:  #6EE7B7;
      --par-bg:   #FFFBEB; --par-tx: #D97706;  --par-bd: #FCD34D;
      --hs-bg:    #FEF2F2; --hs-tx:  #DC2626;  --hs-bd:  #FCA5A5;
      --nav-h:    68px;
      --hdr-h:    60px;
      --sat:      env(safe-area-inset-top,    0px);
      --sab:      env(safe-area-inset-bottom, 0px);
      --r-sm:     10px;
      --r-md:     14px;
      --r-lg:     18px;
      --r-xl:     22px;
    }
    :root[data-theme="dark"] {
      --bg:       #262c4f;
      --card:     #2e355c;
      --card2:    #363e68;
      --text:     #f4f5fb;
      --text2:    rgba(244,245,251,0.72);
      --text3:    rgba(244,245,251,0.48);
      --border:   rgba(255,255,255,0.13);
      --border2:  rgba(255,255,255,0.25);
      --accent:   #4f5fe8;
      --on-acc:   #FFFFFF;
      --acc-tx:   #b3bcff;
      --acc-lt:   rgba(143,156,255,0.16);
      --ok-bg:    rgba(16,185,129,0.16);  --ok-tx:  #34d399; --ok-bd:  rgba(52,211,153,0.45);
      --par-bg:   rgba(245,158,11,0.16);  --par-tx: #fbbf24; --par-bd: rgba(251,191,36,0.45);
      --hs-bg:    rgba(239,68,68,0.16);   --hs-tx:  #f87171; --hs-bd:  rgba(248,113,113,0.45);
      color-scheme: dark;
    }

    html, body { height:100%; height:100dvh; overflow:hidden; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
      background:var(--bg); color:var(--text);
    }

    #app { height:100dvh; display:flex; flex-direction:column; }

    /* ── SCREENS ── */
    .screen { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
    .screen.active { display:flex; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .screen.active { animation:fadeUp 0.2s cubic-bezier(0.22,1,0.36,1); }

    /* ── SCROLL ── */
    .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }

    /* ── SECTION LABEL ── */
    .sec-lbl {
      font-size:11px; font-weight:700; color:var(--text3);
      letter-spacing:.07em; text-transform:uppercase;
      margin-bottom:10px;
    }

    /* ── HEADER ── */
    .hdr {
      background:var(--card);
      border-bottom:0.5px solid var(--border);
      display:flex; align-items:flex-end;
      padding:calc(10px + var(--sat)) 18px 12px;
      gap:10px; flex-shrink:0; z-index:10;
    }
    .hdr-title { font-size:24px; font-weight:700; color:var(--text); flex:1; }
    .hdr-sub   { font-size:13px; color:var(--text3); padding-bottom:2px; }
    .back-btn  {
      width:34px; height:34px; border-radius:var(--r-sm);
      background:var(--bg); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:20px; color:var(--acc-tx); flex-shrink:0;
      transition:opacity .1s, transform .1s;
    }
    .back-btn:active { opacity:.5; transform:translateX(-2px); }

    /* ── BOTTOM NAV ── */
    #nav {
      background:var(--card);
      border-top:0.5px solid var(--border);
      display:none; align-items:flex-start;
      padding-top:6px;
      padding-bottom:calc(8px + var(--sab));
      flex-shrink:0;
    }
    .nb { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:var(--text3); font-size:11px; padding-top:2px; transition:color .15s; }
    .nb .ni { font-size:26px; line-height:1; transition:transform .15s; }
    .nb.on { color:var(--acc-tx); }
    .nb.on .ni { transform:scale(1.1); }
    .nb:active { transform:scale(0.9); }
    .nav-fab {
      width:56px; height:56px; background:var(--accent); border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      border:none; cursor:pointer; color:var(--on-acc); font-size:32px;
      flex-shrink:0; margin:0 8px; margin-bottom:2px;
      transition:transform .12s, opacity .12s;
    }
    .nav-fab:active { transform:scale(0.91); }

    /* ── INVENTORY HEADER ── */
    .inv-hdr {
      background:var(--card);
      padding:calc(10px + var(--sat)) 18px 14px;
      flex-shrink:0; border-bottom:0.5px solid var(--border);
    }
    .inv-hdr-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .inv-title { font-size:26px; font-weight:700; color:var(--text); }
    .inv-count { font-size:13px; color:var(--text3); }

    .sbar {
      display:flex; align-items:center; gap:9px;
      background:var(--bg); border-radius:var(--r-md);
      padding:11px 14px; border:0.5px solid var(--border);
      transition:border-color .15s;
    }
    .sbar:focus-within { border-color:var(--accent); }
    .sbar input {
      flex:1; border:none; outline:none; background:none;
      font-size:15px; color:var(--text); font-family:inherit;
    }
    .sbar input::placeholder { color:var(--text3); }

    /* ── BRAND GRID ── */
    .brand-wrap { padding:16px 18px 4px; flex-shrink:0; }
    .brand-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .brand-all  { grid-column:1/-1; }

    .brand-btn {
      background:var(--card); border-radius:var(--r-lg);
      padding:12px 14px; border:0.5px solid var(--border);
      display:flex; align-items:center; gap:11px; cursor:pointer;
      transition:background .15s, border-color .15s, transform .1s;
    }
    .brand-btn:active { transform:scale(0.97); }
    .brand-btn.on { background:var(--accent); border-color:var(--accent); }
    .brand-btn.on .brand-name { color:var(--on-acc); }
    .brand-btn.on .brand-cnt  { color:rgba(255,255,255,.45); }
    .brand-btn.on .brand-ic   { background:rgba(255,255,255,.12); }

    .brand-ic {
      width:36px; height:36px; border-radius:var(--r-sm);
      background:var(--bg); display:flex; align-items:center;
      justify-content:center; font-size:20px; flex-shrink:0;
    }
    .brand-name { font-size:14px; font-weight:600; color:var(--text); flex:1; }
    .brand-cnt  { font-size:12px; color:var(--text3); }

    /* ── PART LIST ── */
    .list-wrap { padding:14px 18px 24px; }
    .type-wrap { padding:10px 18px 2px; flex-shrink:0; }
    .tchip-row { display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none; }
    .tchip-row::-webkit-scrollbar { display:none; }
    .tchip { display:flex; align-items:center; gap:6px; flex-shrink:0; padding:8px 13px; background:var(--card); border:0.5px solid var(--border); border-radius:50px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; transition:transform .1s; white-space:nowrap; }
    .tchip:active { transform:scale(0.96); }
    .tchip.on { background:var(--accent); border-color:var(--accent); color:var(--on-acc); }
    .tchip-cnt { font-size:11px; color:var(--text3); }
    .tchip.on .tchip-cnt { color:rgba(255,255,255,.5); }

    .pcard {
      background:var(--card); border-radius:var(--r-xl);
      padding:14px 16px; border:0.5px solid var(--border);
      margin-bottom:9px; cursor:pointer;
      display:flex; gap:13px; align-items:center;
      transition:transform .12s;
    }
    .pcard:active { transform:scale(0.978); }
    .pcard-ic {
      width:48px; height:48px; border-radius:var(--r-md);
      background:var(--bg); display:flex; align-items:center;
      justify-content:center; font-size:24px; flex-shrink:0;
    }
    .pcard-info { flex:1; min-width:0; }
    .pcard-ref  { font-size:10px; color:var(--text3); font-family:'SF Mono','Courier New',monospace; margin-bottom:2px; }
    .pcard-name { font-size:15px; font-weight:600; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pcard-sub  { font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── BADGES ── */
    .badge { display:inline-flex; align-items:center; padding:4px 9px; border-radius:7px; font-size:11px; font-weight:700; white-space:nowrap; }
    .b-ok  { background:var(--ok-bg);  color:var(--ok-tx);  }
    .b-par { background:var(--par-bg); color:var(--par-tx); }
    .b-hs  { background:var(--hs-bg);  color:var(--hs-tx);  }

    /* ── ADD FORM ── */
    .add-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 18px 32px; min-height:0; }

    .frow2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .fgrp  { margin-bottom:16px; }
    .flbl  { font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:7px; }
    .finp  {
      width:100%; padding:13px 14px; border-radius:var(--r-md);
      border:0.5px solid var(--border); background:var(--card);
      font-size:15px; color:var(--text); outline:none; font-family:inherit;
      appearance:none; transition:border-color .15s;
    }
    .finp:focus { border-color:var(--accent); border-width:1px; }
    textarea.finp { resize:none; height:80px; }

    .cond-row  { display:flex; gap:8px; }
    .cond-btn  {
      flex:1; padding:11px 4px; border-radius:var(--r-md);
      border:0.5px solid var(--border); background:var(--card);
      font-size:13px; font-weight:600; cursor:pointer; text-align:center; color:var(--text3);
      transition:background .15s, color .15s, border-color .15s, transform .1s;
    }
    .cond-btn:active { transform:scale(0.96); }
    .c-ok  { background:var(--ok-bg);  color:var(--ok-tx);  border-color:var(--ok-bd);  }
    .c-par { background:var(--par-bg); color:var(--par-tx); border-color:var(--par-bd); }
    .c-hs  { background:var(--hs-bg);  color:var(--hs-tx);  border-color:var(--hs-bd);  }

    .photo-row { display:flex; flex-wrap:wrap; gap:12px; }
    .photo-slot {
      width:88px; height:88px; border-radius:var(--r-lg);
      border:1.5px dashed var(--border2); background:var(--card);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; overflow:hidden; position:relative;
      transition:border-color .15s;
    }
    .photo-slot:hover { border-color:var(--accent); }
    .photo-slot img { width:100%; height:100%; object-fit:cover; }
    .photo-del {
      position:absolute; top:5px; right:5px;
      width:22px; height:22px; background:rgba(0,0,0,.55); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:13px; cursor:pointer; z-index:2;
    }

    .compat-wrap { display:flex; flex-wrap:wrap; gap:8px; }
    .ccheck {
      padding:8px 14px; border-radius:var(--r-md);
      border:0.5px solid var(--border); background:var(--card);
      font-size:13px; cursor:pointer; color:var(--text2);
      transition:background .15s, color .15s, border-color .15s;
    }
    .ccheck.on { background:var(--acc-lt); color:var(--acc-tx); border-color:var(--accent); }

    .btn-save {
      width:100%; padding:17px; background:var(--accent); color:var(--on-acc);
      border:none; border-radius:var(--r-lg); font-size:16px; font-weight:700;
      cursor:pointer; font-family:inherit; margin-top:8px;
      transition:opacity .1s, transform .1s;
    }
    .btn-save:active { opacity:.85; transform:scale(0.98); }

    .btn-del {
      width:100%; padding:15px; background:var(--hs-bg); color:var(--hs-tx);
      border:0.5px solid var(--hs-bd); border-radius:var(--r-lg);
      font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:8px;
      transition:opacity .1s;
    }

    /* ── DETAIL ── */
    .detail-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 18px 32px; min-height:0; }
    .detail-ref  { font-family:'SF Mono','Courier New',monospace; font-size:12px; color:var(--text3); margin-bottom:3px; }
    .detail-name { font-size:26px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .detail-sub  { font-size:16px; color:var(--text2); margin-bottom:12px; }

    .thumb-row { display:flex; gap:10px; margin-bottom:16px; }
    .thumb { width:88px; height:88px; border-radius:var(--r-lg); overflow:hidden; cursor:pointer; }
    .thumb img { width:100%; height:100%; object-fit:cover; }

    /* ── NAV PRÉC/SUIV dans la fiche pièce ── */
    #detail-nav { display:none; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px calc(10px + var(--sab)); border-top:0.5px solid var(--border); background:var(--card); flex-shrink:0; }
    .dnav-btn { border:none; background:var(--acc-lt); color:var(--acc-tx); border-radius:10px; padding:9px 15px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
    .dnav-btn:disabled { background:transparent; color:var(--text3); cursor:default; }
    .dnav-pos { font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums; }

    .info-block {
      background:var(--card); border-radius:var(--r-xl);
      border:0.5px solid var(--border); overflow:hidden; margin:16px 0;
    }
    .info-row { display:flex; padding:13px 16px; border-bottom:0.5px solid var(--border); align-items:center; }
    .info-row:last-child { border-bottom:none; }
    .info-lbl { font-size:14px; color:var(--text2); flex:1; }
    .info-val { font-size:14px; font-weight:600; color:var(--text); text-align:right; max-width:65%; }

    .ctag { display:inline-block; padding:5px 11px; background:var(--acc-lt); color:var(--acc-tx); border-radius:var(--r-sm); font-size:12px; font-weight:600; margin:3px 3px 0 0; }

    /* ── SEARCH ── */
    .srch-hdr { background:var(--card); padding:calc(10px + var(--sat)) 18px 16px; border-bottom:0.5px solid var(--border); flex-shrink:0; }
    .srch-title { font-size:26px; font-weight:700; color:var(--text); margin-bottom:14px; }
    .srch-area {
      width:100%; padding:14px; border-radius:var(--r-lg);
      border:0.5px solid var(--border); background:var(--bg);
      font-size:15px; color:var(--text); outline:none;
      font-family:inherit; resize:none; height:90px;
      transition:border-color .15s;
    }
    .srch-area:focus { border-color:var(--accent); border-width:1px; }

    .srch-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 18px 24px; min-height:0; }
    .srch-hint { font-size:13px; color:var(--text3); margin-bottom:14px; line-height:1.55; }
    .btn-srch {
      width:100%; padding:15px; background:var(--accent); color:var(--on-acc);
      border:none; border-radius:var(--r-lg); font-size:15px; font-weight:700;
      cursor:pointer; font-family:inherit; margin-bottom:20px;
      transition:opacity .1s, transform .1s;
    }
    .btn-srch:active { transform:scale(0.98); }

    .res-card {
      background:var(--card); border-radius:var(--r-xl);
      padding:14px 16px; border:0.5px solid var(--border);
      margin-bottom:9px; cursor:pointer;
      display:flex; gap:13px; align-items:center;
      border-left-width:3px; transition:transform .12s;
    }
    .res-card:active { transform:scale(0.978); }
    .res-perfect { border-left-color:var(--ok-tx); }
    .res-close   { border-left-color:var(--par-tx); }
    .res-match   { font-size:10px; font-weight:700; margin-bottom:2px; }
    .res-perfect .res-match { color:var(--ok-tx); }
    .res-close   .res-match { color:var(--par-tx); }

    /* ── SETUP ── */
    #screen-setup {
      height:100dvh; overflow-y:auto;
      padding:calc(28px + var(--sat)) 18px calc(40px + var(--sab));
    }
    .setup-logo { text-align:center; margin-bottom:28px; }
    .setup-card {
      background:var(--card); border-radius:var(--r-xl);
      padding:22px; border:0.5px solid var(--border); margin-bottom:18px;
    }
    .sstep { display:flex; gap:14px; margin-bottom:20px; align-items:flex-start; }
    .sstep:last-child { margin-bottom:0; }
    .snum {
      width:28px; height:28px; border-radius:50%;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:700; flex-shrink:0;
    }
    .stitle { font-size:15px; font-weight:700; margin-bottom:4px; }
    .sdesc  { font-size:13px; color:var(--text2); line-height:1.55; }
    .sdesc a { color:#0066CC; }
    .sdesc code { background:var(--bg); padding:2px 5px; border-radius:5px; font-size:12px; }

    /* ── TYPE GRID ── */
    .type-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:9px; }
    .type-btn {
      background:var(--card); border-radius:var(--r-md);
      padding:11px 4px; border:0.5px solid var(--border);
      display:flex; flex-direction:column; align-items:center; gap:5px;
      cursor:pointer; transition:background .15s, border-color .15s, transform .1s;
    }
    .type-btn:active { transform:scale(0.94); }
    .type-btn.on { background:var(--accent); border-color:var(--accent); }
    .type-btn .t-ic { font-size:20px; line-height:1; }
    .type-btn .t-nm { font-size:10px; font-weight:700; color:var(--text2); text-align:center; line-height:1.2; }
    .type-btn.on .t-nm { color:var(--on-acc); }

    /* ── REF PREVIEW ── */
    .ref-preview {
      display:none; align-items:center; gap:10px;
      background:var(--acc-lt); border-radius:var(--r-md);
      padding:12px 16px; margin-bottom:10px;
    }
    .ref-preview.show { display:flex; }
    .ref-preview-lbl { font-size:12px; color:var(--text3); flex-shrink:0; }
    .ref-preview-val { font-size:16px; font-weight:700; color:var(--acc-tx); font-family:'SF Mono','Courier New',monospace; }

    /* ── TOAST ── */
    #toast {
      position:fixed; bottom:calc(var(--nav-h) + 14px); left:50%;
      transform:translateX(-50%) translateY(120px);
      opacity:0;
      background:rgba(0,0,0,.84); color:#fff;
      padding:11px 20px; border-radius:24px; font-size:14px;
      z-index:999; transition:transform .28s, opacity .28s; white-space:nowrap; pointer-events:none;
    }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* ── LIGHTBOX ── */
    #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:9999; align-items:center; justify-content:center; }
    #lb.open { display:flex; }
    #lb img { max-width:95vw; max-height:90vh; border-radius:var(--r-lg); object-fit:contain; }
    #lb-x { position:absolute; top:18px; right:18px; font-size:32px; color:#fff; background:none; border:none; cursor:pointer; }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:52px 24px; }
    .empty-ico { font-size:52px; margin-bottom:14px; }
    .empty-ttl { font-size:18px; font-weight:700; color:var(--text2); margin-bottom:8px; }
    .empty-dsc { font-size:14px; color:var(--text3); line-height:1.6; }

    /* ── MODE INVENTAIRE (pointage) ── */
    .point-toggle { width:100%; margin-top:12px; padding:12px; border-radius:var(--r-md); border:0.5px solid var(--border); background:var(--card); color:var(--acc-tx); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
    .point-toggle.on { background:var(--accent); color:var(--on-acc); border-color:var(--accent); }
    #pointage-bar { padding:14px 18px 2px; flex-shrink:0; }
    .pbar-card { background:var(--hero); color:#fff; border-radius:var(--r-lg); padding:14px 16px; }
    .pbar-stats { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:11px; gap:12px; }
    .pbar-big { font-size:23px; font-weight:700; line-height:1.1; }
    .pbar-lbl { font-size:12px; opacity:.65; margin-top:2px; }
    .pbar-side { text-align:right; font-size:12px; line-height:1.55; flex-shrink:0; }
    .pbar-prog { height:8px; background:rgba(255,255,255,.18); border-radius:50px; overflow:hidden; margin-bottom:11px; }
    .pbar-prog > div { height:100%; background:#fff; transition:width .3s ease; }
    .pbar-actions { display:flex; gap:8px; }
    .pbar-btn { flex:1; padding:9px 6px; border-radius:var(--r-sm); border:none; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .pbar-neutral { background:rgba(255,255,255,.15); color:#fff; }
    .pbar-del { background:var(--hs-tx); color:#fff; }
    .point-actions { display:flex; gap:6px; flex-shrink:0; }
    .pt-btn { width:44px; height:44px; border-radius:var(--r-md); border:0.5px solid var(--border); background:var(--card); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s,transform .1s; }
    .pt-btn:active { transform:scale(0.9); }
    .pt-yes.on { background:var(--ok-bg); border-color:var(--ok-bd); }
    .pt-no.on  { background:var(--hs-bg); border-color:var(--hs-bd); }
    .pcard.is-present { border-color:var(--ok-bd); }
    .pcard.is-absent  { border-color:var(--hs-bd); opacity:.55; }
    .pcard-seen { font-size:10px; color:var(--text3); margin-top:3px; }

    /* ── Photo dans la carte (grand écran seulement : le téléphone garde l'icône) ── */
    .pcard-ic img { display:none; }
    .theme-btn { width:34px; height:34px; border-radius:var(--r-sm); border:0.5px solid var(--border); background:var(--card2); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
    #side { display:none; }

    /* ══ ÉCRAN LARGE (≥ 768 px) : plein écran, pièces en grille ══ */
    @media (min-width:768px) {
      #parts-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
      #parts-list > .empty { grid-column:1/-1; }
      .pcard { margin-bottom:0; }
      .pcard-name { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25; }
      .pcard-ic.has-img { overflow:hidden; background:var(--card2); }
      .pcard-ic.has-img img { display:block; width:100%; height:100%; object-fit:cover; }
      .pcard-ic.has-img .ic { display:none; }
      #sr { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:9px; }
      #sr > .sec-lbl, #sr > .empty { grid-column:1/-1; }
      #sr .res-card { margin-bottom:0; }
      .brand-grid { grid-template-columns:repeat(4,1fr); }
      .type-grid { grid-template-columns:repeat(6,1fr); }
    }
    @media (hover:hover) and (min-width:768px) {
      .pcard, .res-card { transition:transform .12s, border-color .15s, box-shadow .15s; }
      .pcard:hover, .res-card:hover { border-color:var(--border2); box-shadow:0 4px 14px rgba(26,31,58,.08); }
      .brand-btn:hover, .tchip:hover, .type-btn:hover, .cond-btn:hover, .ccheck:hover { border-color:var(--border2); }
    }

    /* ══ BUREAU (≥ 1100 px) : barre latérale · liste · fiche ══ */
    @media (min-width:1100px) {
      #app { display:grid; grid-template-columns:264px minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100dvh; }
      #app.has-detail { grid-template-columns:264px minmax(0,1fr) 440px; }
      #app > .screen { grid-column:2; grid-row:1; }
      #nav, #launcher-btn { display:none !important; }
      #toast { bottom:24px; }

      /* Barre latérale */
      #side { display:flex; flex-direction:column; grid-column:1; grid-row:1; background:var(--card); border-right:0.5px solid var(--border); min-height:0; }
      .side-top { padding:18px 16px 14px; background:var(--hero); color:#fff; }
      .side-logo { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
      .side-logo b { font-size:20px; font-weight:800; letter-spacing:-.01em; }
      .side-logo span { font-size:12px; opacity:.7; }
      .side-top .sbar { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); padding:9px 12px; }
      .side-top .sbar input { color:#fff; font-size:14px; }
      .side-top .sbar input::placeholder { color:rgba(255,255,255,.6); }
      .side-top .sbar:focus-within { border-color:rgba(255,255,255,.6); }
      .side-kbd { font-size:10px; border:1px solid rgba(255,255,255,.35); border-radius:5px; padding:1px 5px; opacity:.75; }
      .side-scroll { flex:1; overflow-y:auto; padding:14px 12px; min-height:0; }
      .side-add { width:100%; padding:12px; border:none; border-radius:var(--r-md); background:var(--accent); color:var(--on-acc); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:10px; }
      .side-add:hover { filter:brightness(1.12); }
      .side-sec { font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin:16px 6px 6px; }
      .side-it { width:100%; display:flex; align-items:center; gap:9px; padding:8px 10px; border:none; background:none; border-radius:var(--r-sm); font-size:14px; color:var(--text); cursor:pointer; font-family:inherit; text-align:left; }
      .side-it:hover { background:var(--card2); }
      .side-it.on { background:var(--acc-lt); color:var(--acc-tx); font-weight:700; }
      .side-it .si-ic { width:20px; text-align:center; flex-shrink:0; }
      .side-it .si-nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .side-it .si-ct { font-size:12px; color:var(--text3); font-variant-numeric:tabular-nums; }
      .side-foot { padding:12px; border-top:0.5px solid var(--border); display:flex; gap:8px; }
      .side-foot button { flex:1; padding:9px; border:0.5px solid var(--border); border-radius:var(--r-sm); background:var(--card2); color:var(--text2); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
      .side-foot button:hover { border-color:var(--border2); color:var(--text); }

      /* Inventaire : les filtres sont dans la barre latérale */
      #screen-inventory .inv-hdr .sbar, #screen-inventory .brand-wrap, #screen-inventory .type-wrap, .inv-theme { display:none; }
      .inv-hdr { padding:20px 28px 16px; display:flex; align-items:center; gap:16px; }
      .inv-hdr-top { margin-bottom:0; flex:1; justify-content:flex-start; gap:14px; align-items:baseline; }
      .point-toggle { width:auto; margin-top:0; padding:10px 16px; }
      .list-wrap { padding:18px 28px 32px; }
      #pointage-bar { padding:16px 28px 0; }
      .pcard.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }

      /* Fiche : panneau de droite (ne remplace plus la liste) */
      #screen-detail { display:none; }
      #screen-detail.open { display:flex; grid-column:3; grid-row:1; border-left:0.5px solid var(--border); background:var(--bg); animation:none; }
      #screen-detail .hdr { padding:14px 16px 12px; }
      #detail-nav { padding:10px 14px; }

      /* Ajouter / modifier : formulaire centré sur deux colonnes */
      #screen-add .hdr, #screen-search .srch-hdr { padding:20px 28px 16px; }
      .add-scroll { padding:24px 28px 40px; }
      .add-form { max-width:980px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; column-gap:28px; align-items:start; }
      .add-form > .fgrp { margin-bottom:20px; }
      .add-form > .span2 { grid-column:1/-1; }
      .srch-body { padding:20px 28px 32px; }
      .srch-body > .srch-hint, .srch-body > .btn-srch { max-width:520px; }
      .srch-area { height:70px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ══ BARRE LATÉRALE (bureau ≥ 1100 px uniquement) ══════ -->
  <aside id="side">
    <div class="side-top">
      <div class="side-logo"><b>PartStack</b><span id="side-count"></span></div>
      <div class="sbar">
        <span style="font-size:14px;opacity:.8">🔍</span>
        <input type="search" id="side-q" placeholder="Chercher une pièce…" oninput="sideSearch(this.value)" autocomplete="off">
        <span class="side-kbd">/</span>
      </div>
    </div>
    <div class="side-scroll">
      <button class="side-add" onclick="go('add')">＋ Ajouter une pièce</button>
      <button class="side-it" id="si-inv" onclick="go('inventory')"><span class="si-ic">📦</span><span class="si-nm">Inventaire</span></button>
      <button class="side-it" id="si-srch" onclick="go('search')"><span class="si-ic">🧠</span><span class="si-nm">Recherche en langage libre</span></button>
      <div class="side-sec">Marques</div>
      <div id="side-brands"></div>
      <div class="side-sec">Types</div>
      <div id="side-types"></div>
    </div>
    <div class="side-foot">
      <button onclick="toggleTheme()" id="side-theme">🌙 Sombre</button>
      <button onclick="window.location.href='https://stockvault-sable.vercel.app/launcher'">🏠 Lanceur</button>
    </div>
  </aside>

  <!-- ══ SETUP ══════════════════════════════════════════════ -->
  <div id="screen-setup" class="screen" style="display:none"></div>

  <!-- ══ INVENTAIRE ════════════════════════════════════════ -->
  <div id="screen-inventory" class="screen">
    <div class="inv-hdr">
      <div class="inv-hdr-top">
        <div class="inv-title">Inventaire</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="inv-count" id="count-lbl">0 pièce</div>
          <button class="theme-btn inv-theme" onclick="toggleTheme()" aria-label="Changer de thème" id="inv-theme">🌙</button>
        </div>
      </div>
      <div class="sbar">
        <span style="font-size:16px;color:var(--text3)">🔍</span>
        <input type="search" id="inv-q" placeholder="Chercher une pièce…" oninput="filterInv(this.value)" autocomplete="off">
      </div>
      <button id="pointage-toggle" class="point-toggle" onclick="togglePointage()">📋 Faire l'inventaire</button>
    </div>

    <div class="scroll">
      <div id="pointage-bar" style="display:none"></div>
      <div class="brand-wrap">
        <div class="sec-lbl">Filtrer par marque</div>
        <div class="brand-grid" id="brand-grid"></div>
      </div>
      <div class="type-wrap">
        <div class="sec-lbl">Filtrer par type</div>
        <div class="tchip-row" id="type-row"></div>
      </div>
      <div class="list-wrap">
        <div class="sec-lbl" id="list-lbl">Toutes les pièces</div>
        <div id="parts-list"></div>
      </div>
    </div>
  </div>

  <!-- ══ AJOUTER ═══════════════════════════════════════════ -->
  <div id="screen-add" class="screen">
    <div class="hdr">
      <button class="back-btn" onclick="go('inventory')">←</button>
      <div class="hdr-title" style="font-size:18px">Ajouter une pièce</div>
    </div>
    <div class="add-scroll"><div class="add-form">
      <div class="fgrp">
        <label class="flbl">Marque</label>
        <div class="brand-grid" style="margin-bottom:9px">
          <div class="brand-btn" data-brand="Apple"   onclick="selBrand('Apple',this)"><div class="brand-ic">🍎</div><span class="brand-name">Apple</span></div>
          <div class="brand-btn" data-brand="Samsung" onclick="selBrand('Samsung',this)"><div class="brand-ic">🔷</div><span class="brand-name">Samsung</span></div>
          <div class="brand-btn" data-brand="Xiaomi"  onclick="selBrand('Xiaomi',this)"><div class="brand-ic">📱</div><span class="brand-name">Xiaomi</span></div>
          <div class="brand-btn" data-brand="Huawei"  onclick="selBrand('Huawei',this)"><div class="brand-ic">🌸</div><span class="brand-name">Huawei</span></div>
        </div>
        <select id="a-brand-other" class="finp" onchange="selBrandOther(this.value)">
          <option value="">Autre marque…</option>
          <option>OnePlus</option><option>Google</option><option>Autre</option>
        </select>
      </div>
      <div class="fgrp">
        <label class="flbl">Modèle</label>
        <input type="text" id="a-model" class="finp" placeholder="ex: iPhone 12, Galaxy S21…" oninput="onBMChange()">
      </div>
      <div class="fgrp">
        <label class="flbl">Type de pièce</label>
        <div class="type-grid">
          <div class="type-btn" data-type="Batterie"          onclick="selType('Batterie',this)">          <span class="t-ic">🔋</span><span class="t-nm">Batterie</span></div>
          <div class="type-btn" data-type="Écran"             onclick="selType('Écran',this)">             <span class="t-ic">🖥️</span><span class="t-nm">Écran</span></div>
          <div class="type-btn" data-type="Chassis"           onclick="selType('Chassis',this)">           <span class="t-ic">📲</span><span class="t-nm">Chassis</span></div>
          <div class="type-btn" data-type="Caméra"            onclick="selType('Caméra',this)">            <span class="t-ic">📷</span><span class="t-nm">Caméra</span></div>
          <div class="type-btn" data-type="Connecteur charge" onclick="selType('Connecteur charge',this)"> <span class="t-ic">🔌</span><span class="t-nm">Connecteur</span></div>
          <div class="type-btn" data-type="Haut-parleur"      onclick="selType('Haut-parleur',this)">      <span class="t-ic">🔊</span><span class="t-nm">H-parleur</span></div>
        </div>
        <select id="a-type-other" class="finp" onchange="selTypeOther(this.value)">
          <option value="">Autre type…</option>
          <option>Micro</option><option>Vibreur</option><option>Bouton</option><option>Nappe</option><option>Autre</option>
        </select>
      </div>
      <div class="fgrp">
        <label class="flbl">État</label>
        <div class="cond-row">
          <button class="cond-btn" data-v="ok"      onclick="selCond('ok')">✅ OK</button>
          <button class="cond-btn" data-v="partial" onclick="selCond('partial')">⚠️ Partiel</button>
          <button class="cond-btn" data-v="broken"  onclick="selCond('broken')">❌ HS</button>
        </div>
      </div>
      <div class="fgrp span2">
        <label class="flbl">Notes</label>
        <textarea id="a-notes" class="finp" placeholder="Ce qui marche / ne marche pas…"></textarea>
      </div>
      <div class="fgrp span2" id="compat-sec" style="display:none">
        <label class="flbl">Compatible aussi avec</label>
        <div class="compat-wrap" id="compat-list"></div>
      </div>
      <div class="fgrp span2">
        <label class="flbl" id="photo-lbl">Photos (max 4)</label>
        <div class="photo-row">
          <div class="photo-slot" id="ps0" onclick="trigPhoto(0)">
            <span style="font-size:28px;color:var(--text3)">📷</span>
            <input type="file" id="pi0" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(0,this)">
          </div>
          <div class="photo-slot" id="ps1" onclick="trigPhoto(1)">
            <span style="font-size:26px;color:var(--text3)">+</span>
            <input type="file" id="pi1" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(1,this)">
          </div>
          <div class="photo-slot" id="ps2" onclick="trigPhoto(2)">
            <span style="font-size:26px;color:var(--text3)">+</span>
            <input type="file" id="pi2" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(2,this)">
          </div>
          <div class="photo-slot" id="ps3" onclick="trigPhoto(3)">
            <span style="font-size:26px;color:var(--text3)">+</span>
            <input type="file" id="pi3" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(3,this)">
          </div>
        </div>
      </div>
      <div class="span2">
      <div class="ref-preview" id="ref-preview">
        <span class="ref-preview-lbl">Référence :</span>
        <span class="ref-preview-val" id="ref-preview-val"></span>
      </div>
      <button class="btn-save" id="save-btn" onclick="savePart()">Enregistrer la pièce</button>
      </div>
    </div></div>
  </div>

  <!-- ══ DÉTAIL ════════════════════════════════════════════ -->
  <div id="screen-detail" class="screen">
    <div class="hdr">
      <button class="back-btn" id="detail-back" onclick="goBack()">←</button>
      <div class="hdr-title" id="detail-hdr" style="font-size:16px;font-family:monospace;font-weight:500"></div>
      <button class="back-btn" onclick="showEditForm(curPartId)" style="font-size:18px">✏️</button>
    </div>
    <div class="detail-scroll" id="detail-body"></div>
    <div id="detail-nav"></div>
  </div>

  <!-- ══ RECHERCHE ════════════════════════════════════════ -->
  <div id="screen-search" class="screen">
    <div class="srch-hdr">
      <div class="srch-title">Recherche</div>
      <textarea id="sq" class="srch-area" placeholder="ex: batterie pour réparer un iPhone 12&#10;ex: chassis Samsung propre&#10;ex: écran fonctionnel Note 20"></textarea>
    </div>
    <div class="srch-body">
      <div class="srch-hint">Décris en langage libre ce dont tu as besoin.</div>
      <button class="btn-srch" onclick="smartSearch()">Trouver →</button>
      <div id="sr"></div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <div id="nav">
    <button class="nb on" id="nb-inv" onclick="go('inventory')">
      <span class="ni">📦</span><span>Inventaire</span>
    </button>
    <button class="nav-fab" onclick="go('add')">+</button>
    <button class="nb" id="nb-srch" onclick="go('search')">
      <span class="ni">🔍</span><span>Rechercher</span>
    </button>
  </div>
</div>

<!-- Lightbox -->
<div id="lb" onclick="closeLb()">
  <button id="lb-x" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
</div>
  <!-- Bouton retour Launcher -->
<button id="launcher-btn" onclick="window.location.href='https://stockvault-sable.vercel.app/launcher'" style="
  position: fixed;
  bottom: 90px;
  right: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff4d5a, #ff6b35);
  border: none;
  cursor: pointer;
  font-size: 22px;
  z-index: 9998;
  box-shadow: 0 8px 24px rgba(255,77,90,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
">🏠</button>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let db = null, allParts = [], brandFilter = 'all', typeFilter = 'all', searchQ = '', prevScreen = 'inventory', curPartId = null, photos = [null,null], curCond = null, curBrand = null, curType = null, editPartId = null;

// MODE PRÉSENTATION : flag transmis par le launcher (?present=1). Si actif, on affiche
// de FAUSSES pièces et on bloque toute écriture (lecture seule) pour une démo.
let OPEN_PART = (function(){ try { return new URLSearchParams(location.search).get('part'); } catch(e){ return null; } })();
const PRESENT = (function(){ try { return new URLSearchParams(location.search).get('present')==='1'; } catch(e){ return false; } })();
const DEMO_PARTS = [
  {id:"p1",ref:"DEMO-EC1",type:"Écran",brand:"Apple",model:"iPhone 12",condition:"ok",notes:"Testé, tactile OK",historique:[],photos:[]},
  {id:"p2",ref:"DEMO-BA1",type:"Batterie",brand:"Apple",model:"iPhone 11",condition:"ok",notes:"89% santé",historique:[],photos:[]},
  {id:"p3",ref:"DEMO-EC2",type:"Écran",brand:"Samsung",model:"Galaxy S21",condition:"partial",notes:"Micro-rayures",historique:[],photos:[]},
  {id:"p4",ref:"DEMO-CO1",type:"Connecteur charge",brand:"Apple",model:"iPhone 13",condition:"ok",notes:"",historique:[],photos:[]},
  {id:"p5",ref:"DEMO-CA1",type:"Caméra",brand:"Apple",model:"iPhone 12 Pro",condition:"ok",notes:"Bloc arrière",historique:[],photos:[]},
  {id:"p6",ref:"DEMO-BA2",type:"Batterie",brand:"Samsung",model:"Galaxy S20",condition:"partial",notes:"",historique:[],photos:[]},
  {id:"p7",ref:"DEMO-EC3",type:"Écran",brand:"Apple",model:"iPhone 13 Pro",condition:"broken",notes:"Pour pièces",historique:[],photos:[]},
  {id:"p8",ref:"DEMO-HP1",type:"Haut-parleur",brand:"Apple",model:"iPhone 11",condition:"ok",notes:"",historique:[],photos:[]},
  {id:"p9",ref:"DEMO-NA1",type:"Nappe",brand:"Samsung",model:"Galaxy A54",condition:"ok",notes:"Nappe power",historique:[],photos:[]},
  {id:"p10",ref:"DEMO-BO1",type:"Bouton",brand:"Apple",model:"iPhone 12",condition:"ok",notes:"",historique:[],photos:[]}
];
photos = [null,null,null,null];
// Mode inventaire (pointage physique) : sessionStart = début de la session en cours.
// Une pièce est « pointée cette session » si son pointeLe >= sessionStart.
let editExtraPhotos = [];   // photos au-delà des 2 slots d'édition → préservées (ex. articles transformés depuis StockVault)

const CLOUDINARY = { cloud: "di6qnlcgy", preset: "sjfvdj53" };
async // Règle de recherche commune (identique à lib/cherche des apps) : ni casse, accents,
// tirets ni espaces ; mots dans n'importe quel ordre.
function correspond(texte, q){
  const plat=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const qc=plat(q).replace(/[^a-z0-9]/g,''); if(!qc) return false;
  const t=plat(texte), tc=t.replace(/[^a-z0-9]/g,''); if(tc.includes(qc)) return true;
  const mots=plat(q).split(/[^a-z0-9]+/).filter(Boolean); if(mots.length<2) return false;
  const T=new Set(t.split(/[^a-z0-9]+/));
  return mots.every(w=>w.length>=3?tc.includes(w):T.has(w));
}
function uploadCloudinary(dataUrl) {
  const fd = new FormData();
  fd.append("file", dataUrl);
  fd.append("upload_preset", CLOUDINARY.preset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`, { method: "POST", body: fd });
  const j = await res.json();
  if (!res.ok || !j.secure_url) throw new Error((j && j.error && j.error.message) || "upload échoué");
  return j.secure_url;
}
function optim(url, w) {
  if (!url || typeof url !== "string" || !url.includes("/upload/")) return url;
  if (url.includes("/upload/f_auto")) return url;
  return url.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`);
}

const DESK = window.matchMedia('(min-width:1100px)');
const isDesk = () => DESK.matches;
let mainScreen = 'inventory';   // écran affiché dans la colonne centrale
function go(name) {
  if (isDesk() && name==='detail') { openDetailPanel(); return; }
  SCREENS.forEach(s => { const el=document.getElementById('screen-'+s); if(el){el.classList.remove('active');} });
  const t = document.getElementById('screen-'+name);
  if (t) { t.style.animation='none'; t.offsetHeight; t.style.animation=''; t.classList.add('active'); }
  if (name!=='detail') mainScreen = name;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));

  if (name==='search')    document.getElementById('nb-srch')?.classList.add('on');
  document.getElementById('si-inv')?.classList.toggle('on', name==='inventory');
  document.getElementById('si-srch')?.classList.toggle('on', name==='search');
  if (name==='add' && !editPartId) resetAdd();
}

function subscribe() {
  if (PRESENT) { allParts = DEMO_PARTS.slice(); renderBrands(); renderTypes(); renderList(); updateCount(); return; }
  if (!db) return;
  db.collection('parts').orderBy('createdAt','desc').onSnapshot(snap => {
    allParts = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderBrands(); renderTypes(); renderList(); updateCount();
    refreshOpenDetail();
    // ?part=<id> (clic sur un résultat de la recherche du launcher) : ouvre la fiche une seule fois.
    if (OPEN_PART && allParts.some(p=>p.id===OPEN_PART)) { const id = OPEN_PART; OPEN_PART = null; showDetail(id,'inventory'); }
  }, e=>{ console.error(e); toast('Erreur de sync'); });
}

async function savePart() {
  if(PRESENT){toast("Mode démo — lecture seule");return;} 
  const brand=curBrand, model=document.getElementById('a-model').value.trim(), type=curType, notes=document.getElementById('a-notes').value.trim();
  if (!brand||!model||!type) { toast('⚠️ Marque, modèle et type requis'); return; }
  if (!curCond)               { toast("⚠️ Indique l'état"); return; }
  const compatible = Array.from(document.querySelectorAll('.ccheck.on')).map(e=>e.dataset.m);
  // On préserve les photos au-delà des 2 slots (elles ne sont pas éditables mais ne doivent pas disparaître).
  const pData = { brand, model, type, condition:curCond, notes, compatible, photos:photos.filter(Boolean).concat(editExtraPhotos||[]) };
  try {
    if (editPartId) {
      await db.collection('parts').doc(editPartId).update(pData);
      logAudit('piece.modif', `${brand} ${model}`, type);
      toast('✅ Pièce modifiée'); editPartId=null; go('inventory');
    } else {
      const ref = genRef(brand,model,type);
      await db.collection('parts').add({ ref, ...pData, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
      logAudit('piece.ajout', ref, `${brand} ${model} · ${type}`);
      toast('✅ '+ref+' enregistrée'); go('inventory');

  } catch(e) { toast("Erreur d'enregistrement"); console.error(e); }
}

function mShort(m) { return m.replace(/iphone/i,'').replace(/galaxy/i,'').replace(/redmi/i,'R').replace(/[^0-9A-Za-z+]/g,'').toUpperCase().slice(0,5); }
function genRef(brand,model,type) {
  const b=BRAND_CD[brand]||'AU', m=mShort(model), t=TYPE_CD[type]||'AUT', base=`${b}${m}-${t}`;
  return base+'-'+(allParts.filter(p=>p.ref&&p.ref.startsWith(base+'-')).length+1);
}

// Applique les filtres actifs (marque + type + recherche sans séparateurs).
function filteredParts() {
  let parts = [...allParts];
  if (brandFilter!=='all') parts=parts.filter(p=>p.brand===brandFilter);
  if (typeFilter!=='all')  parts=parts.filter(p=>p.type===typeFilter);
  if (searchQ) {
    parts=parts.filter(p=>correspond([p.model,p.brand,p.type,p.ref,p.notes].join(' '),searchQ));
  }
  return parts;
}
// Pièce pointée durant la session d'inventaire en cours ?
function isPointed(p) { return !!(p.pointeLe && (!sessionStart || p.pointeLe >= sessionStart)); }
function fmtDay(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }

// Icône du type ; sur grand écran, la 1re photo la remplace (le CSS masque la photo sur téléphone).
function cardIc(p) {
  const ph = (p.photos||[])[0];
  return `<div class="pcard-ic${ph?' has-img':''}">${ph?`<img src="${optim(ph,240)}" alt="" loading="lazy">`:''}<span class="ic">${TYPE_IC[p.type]||'🔧'}</span></div>`;
}
function cardNormal(p) {
  return `<div class="pcard${p.id===curPartId?' sel':''}" data-id="${p.id}" onclick="showDetail('${p.id}','inventory')">
      ${cardIc(p)}
      <div class="pcard-info">
        <div class="pcard-ref">${esc(p.ref||'')}</div>
        <div class="pcard-name">${esc(p.type)} — ${esc(p.model)}</div>
        <div class="pcard-sub">${esc(p.brand)}${p.notes?' · '+esc(p.notes.slice(0,42))+(p.notes.length>42?'…':''):''}</div>
      </div>
      <span class="badge ${bCls(p.condition)}">${bLbl(p.condition)}</span>
    </div>`;
}
function cardPointage(p) {
  const pointed = isPointed(p);
  const cls = `pcard${pointed&&p.present===true?' is-present':''}${pointed&&p.present===false?' is-absent':''}`;
  const seen = p.verifieLe ? `<div class="pcard-seen">✔︎ vérifiée ${fmtDay(p.verifieLe)}</div>` : `<div class="pcard-seen">jamais vérifiée</div>`;
  return `<div class="${cls}${p.id===curPartId?' sel':''}" data-id="${p.id}">
      ${cardIc(p)}
      <div class="pcard-info" onclick="showDetail('${p.id}','inventory')">
        <div class="pcard-ref">${esc(p.ref||'')}</div>
        <div class="pcard-name">${esc(p.type)} — ${esc(p.model)}</div>
        <div class="pcard-sub">${esc(p.brand)}</div>
        ${seen}
      </div>
      <div class="point-actions">
        <button class="pt-btn pt-yes${pointed&&p.present===true?' on':''}" onclick="markPart('${p.id}',true)">✅</button>
        <button class="pt-btn pt-no${pointed&&p.present===false?' on':''}" onclick="markPart('${p.id}',false)">❌</button>
      </div>
    </div>`;
}

function renderList() {
  const parts = filteredParts();
  const lbl = document.getElementById('list-lbl');
  const bits = []; if (brandFilter!=='all') bits.push(brandFilter); if (typeFilter!=='all') bits.push(typeFilter);
  lbl.textContent = bits.length ? parts.length+' pièce'+(parts.length!==1?'s':'')+' · '+bits.join(' · ') : 'Toutes les pièces';

  renderPointageBar(parts);
  let list = parts;
  if (pointageMode && hidePointed) list = parts.filter(p=>!isPointed(p));
  navIds = list.map(p=>p.id);   // ordre pour Précédent/Suivant
  if (curPartId) renderDetailNav();   // la barre Précédent/Suivant suit le filtre en cours

  const el = document.getElementById('parts-list');
  if (!list.length) {
    const allDone = pointageMode && hidePointed && allParts.length;
    el.innerHTML=`<div class="empty"><div class="empty-ico">${allDone?'✅':'📦'}</div><div class="empty-ttl">${allParts.length?(allDone?'Tout est pointé !':'Aucun résultat'):'Inventaire vide'}</div><div class="empty-dsc">${allParts.length?(allDone?'Toutes les pièces de cette vue ont été vérifiées.':'Essaie un autre filtre.'):'Appuie sur + pour ajouter ta première pièce.'}</div></div>`;
    return;
  }
  el.innerHTML = list.map(p=> pointageMode ? cardPointage(p) : cardNormal(p)).join('');
}

function togglePointage() {

  const btn = document.getElementById('pointage-toggle');
  if (pointageMode) {
    btn.textContent = "✓ Terminer l'inventaire"; btn.classList.add('on');   // n'ouvre PAS de session : le pointage existant reste visible
  } else {
    btn.textContent = "📋 Faire l'inventaire"; btn.classList.remove('on'); hidePointed = false;
  }
  renderList();
}
function toggleHidePointed() { hidePointed = !hidePointed; renderList(); }

function renderPointageBar(parts) {
  const bar = document.getElementById('pointage-bar');
  if (!bar) return;
  if (!pointageMode) { bar.style.display='none'; return; }
  bar.style.display='block';
  const pointed = parts.filter(isPointed);
  const pres = pointed.filter(p=>p.present===true).length;
  const abs  = pointed.filter(p=>p.present===false).length;
  const total = parts.length, done = pointed.length, reste = total - done;
  const pct = total ? Math.round(done/total*100) : 0;
  const filtre = (brandFilter!=='all'||typeFilter!=='all'||searchQ) ? ' (vue filtrée)' : '';
  bar.innerHTML = `<div class="pbar-card">
    <div class="pbar-stats">
      <div><div class="pbar-big">${done} / ${total}</div><div class="pbar-lbl">pointées${filtre}</div></div>
      <div class="pbar-side"><div>✅ ${pres} présente${pres>1?'s':''}</div><div>❌ ${abs} absente${abs>1?'s':''}</div><div style="opacity:.65">reste ${reste}</div></div>
    </div>
    <div class="pbar-prog"><div style="width:${pct}%"></div></div>
    <div class="pbar-actions">
      <button class="pbar-btn pbar-neutral" onclick="toggleHidePointed()">${hidePointed?'👁 Tout voir':'🙈 Masquer pointées'}</button>
      ${abs?`<button class="pbar-btn pbar-del" onclick="deleteAbsents()">🗑 Suppr. ${abs} absente${abs>1?'s':''}</button>`:''}
      <button class="pbar-btn pbar-neutral" onclick="resetInventory()">🔄 Nouveau</button>
    </div>
  </div>`;
}

async function markPart(id, present) {
  if(PRESENT){toast("Mode démo — lecture seule");return;} 
  const p = allParts.find(x=>x.id===id); if (!p) return;
  const now = new Date().toISOString();
  const data = { present, pointeLe: now };
  if (present) data.verifieLe = now;            // « présente » = vérifiée maintenant
  Object.assign(p, data);                        // maj optimiste (avant le snapshot)
  renderList();
  try { await db.collection('parts').doc(id).update(data); }
  catch(e) { toast('Erreur, réessaie'); console.error(e); }
}

async function deleteAbsents() {
  if(PRESENT){toast("Mode démo — lecture seule");return;} 
  const absents = filteredParts().filter(p=>isPointed(p) && p.present===false);
  if (!absents.length) { toast('Aucune absente à supprimer'); return; }
  if (!confirm(`Supprimer définitivement ${absents.length} pièce(s) marquée(s) absente(s) ?`)) return;
  try {
    const batch = db.batch();
    absents.forEach(p=>batch.delete(db.collection('parts').doc(p.id)));
    await batch.commit();
    logAudit('inventaire.suppr_absentes', `${absents.length} pièce(s)`, '');
    toast(`✅ ${absents.length} pièce(s) supprimée(s)`);
  } catch(e) { toast('Erreur suppression'); console.error(e); }
}

function resetInventory() {
  if (!confirm('Démarrer un nouvel inventaire ? Le pointage en cours repart à zéro. (Les dates de vérification déjà enregistrées sur les pièces sont conservées.)')) return;
  sessionStart = new Date().toISOString();
  persistSession(sessionStart);
  hidePointed = false;
  renderList();
  logAudit('inventaire.reset', '', 'nouvel inventaire démarré');
  toast('🔄 Nouvel inventaire démarré');
}

// Session d'inventaire durable : Firebase = source de vérité, localStorage = cache rapide.
function persistSession(ts) {
  // Firebase = seule source de vérité (plus de localStorage → plus de reset accidentel).
  try { if (ts === null) { db && db.collection('meta').doc('inventaire').delete(); } else { db && db.collection('meta').doc('inventaire').set({ sessionStart: ts }, { merge:true }); } } catch(e) {}
}
async function loadInventorySession() {
  try {
    const d = await db.collection('meta').doc('inventaire').get();
    sessionStart = (d.exists && d.data().sessionStart) || null;   // rien = on voit tout le pointage
    if (pointageMode) renderList();
  } catch(e) { /* hors-ligne : sessionStart reste null → tout le pointage reste visible */ }
}

function updateCount() { const n=allParts.length, t=n+' pièce'+(n!==1?'s':''); document.getElementById('count-lbl').textContent=t; const sc=document.getElementById('side-count'); if(sc) sc.textContent=t; }
function filterInv(v) { searchQ=v; const sq=document.getElementById('side-q'); if(sq&&sq.value!==v) sq.value=v; renderList(); }
// Recherche de la barre latérale = même filtre que l'inventaire (champs synchronisés).
function sideSearch(v) { const iq=document.getElementById('inv-q'); if(iq) iq.value=v; if (mainScreen!=='inventory') go('inventory'); filterInv(v); }

// ═══════════════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════════════
// ── Historique / Réparations (journal interne par pièce) ──
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtHD(iso){try{return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso||'';}}
async function addHisto(){
  if(PRESENT){toast("Mode démo — lecture seule");return;} 
  const ta=document.getElementById('histo-input'); if(!ta) return;
  const texte=(ta.value||'').trim(); if(!texte) return;
  const p=allParts.find(x=>x.id===curPartId); if(!p) return;
  const liste=[...(p.historique||[]),{date:new Date().toISOString(),texte}];
  try{
    await db.collection('parts').doc(curPartId).update({historique:liste});
    p.historique=liste;                 // maj locale immédiate (avant le snapshot)
    showDetail(curPartId,prevScreen);
    toast('✅ Ajouté au journal');
  }catch(e){ toast('Erreur, réessaie'); }
}
async function delHisto(idx){
  if(PRESENT){toast("Mode démo — lecture seule");return;} 
  const p=allParts.find(x=>x.id===curPartId); if(!p) return;
  const liste=(p.historique||[]).filter((_,i)=>i!==idx);
  try{
    await db.collection('parts').doc(curPartId).update({historique:liste});
    p.historique=liste;
    showDetail(curPartId,prevScreen);
  }catch(e){ toast('Erreur, réessaie'); }
}

function showDetail(id,from) {
  prevScreen=from||'inventory'; curPartId=id;
  if (!renderDetail(id)) return;
  go('detail');
  if (isDesk()) document.getElementById('detail-body').scrollTop = 0;
}
// Panneau ouvert sur bureau : suit les modifications (autre appareil, édition, suppression).
function refreshOpenDetail() {
  if (!isDesk() || !curPartId || !document.getElementById('screen-detail').classList.contains('open')) return;
  if (!allParts.some(x=>x.id===curPartId)) { closeDetailPanel(); return; }
  const ta=document.getElementById('histo-input'), brouillon=ta?ta.value:'', focus=document.activeElement===ta;
  const sc=document.getElementById('detail-body').scrollTop;
  renderDetail(curPartId);
  const ta2=document.getElementById('histo-input'); if(ta2){ ta2.value=brouillon; if(focus) ta2.focus(); }
  document.getElementById('detail-body').scrollTop=sc;
}
function renderDetail(id) {
  const p=allParts.find(x=>x.id===id); if (!p) return false;
  document.getElementById('detail-hdr').textContent=p.ref||'Détail';
  const ph=(p.photos||[]).length?`<div class="thumb-row">${(p.photos||[]).map(s=>`<div class="thumb" onclick="openLb('${s}')"><img src="${optim(s,400)}" alt=""></div>`).join('')}</div>`:'';
  const cm=(p.compatible||[]).length?`<div style="margin-bottom:14px"><div class="sec-lbl" style="margin-bottom:8px">Compatible avec</div><div>${(p.compatible||[]).map(m=>`<span class="ctag">${m}</span>`).join('')}</div></div>`:'';
  // Journal Historique / Réparations (interne) — plus récent en haut.
  const hist=(p.historique||[]).map((h,i)=>({...h,_i:i})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const histRows=hist.length?hist.map(h=>`<div class="info-row" style="align-items:flex-start;gap:10px">
        <div style="flex:1;text-align:left;min-width:0">
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">🕗 ${fmtHD(h.date)}${h.auteur?' · '+esc(h.auteur):''}</div>
          <div style="font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word">${esc(h.texte)}</div>
        </div>
        <button onclick="delHisto(${h._i})" title="Supprimer" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;flex-shrink:0;padding:0 2px">✕</button>
      </div>`).join(''):`<div class="info-row"><span style="font-size:13px;color:var(--text3)">Aucune réparation notée. Ajoute la première ci-dessous.</span></div>`;
  const histoSection=`<div class="sec-lbl" style="margin:20px 0 8px">🔧 Historique / Réparations</div>
    <div class="info-block">${histRows}</div>
    <textarea id="histo-input" rows="2" placeholder="Ex : Testée OK, reconditionnée / défaut connecteur…" style="width:100%;box-sizing:border-box;background:var(--card);border:0.5px solid var(--border);border-radius:var(--r-md);padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;resize:vertical"></textarea>
    <button onclick="addHisto()" style="width:100%;margin-top:8px;padding:13px;border:0.5px solid var(--border);border-radius:var(--r-lg);background:var(--acc-lt);color:var(--acc-tx);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">➕ Ajouter au journal</button>`;
  document.getElementById('detail-body').innerHTML=`${ph}
    <div style="margin-bottom:4px">
      <div class="detail-ref">${p.ref||''}</div>
      <div class="detail-name">${p.type}</div>
      <div class="detail-sub">${p.brand} · ${p.model}</div>
      <span class="badge ${bCls(p.condition)}">${bLbl(p.condition)}</span>
    </div>
    <div class="info-block">
      <div class="info-row"><span class="info-lbl">Marque</span><span class="info-val">${p.brand}</span></div>
      <div class="info-row"><span class="info-lbl">Modèle</span><span class="info-val">${p.model}</span></div>
      <div class="info-row"><span class="info-lbl">Type</span><span class="info-val">${p.type}</span></div>
      <div class="info-row"><span class="info-lbl">État</span><span class="info-val"><span class="badge ${bCls(p.condition)}">${bLbl(p.condition)}</span></span></div>
      ${p.notes?`<div class="info-row"><span class="info-lbl">Notes</span><span class="info-val">${p.notes}</span></div>`:''}
      <div class="info-row"><span class="info-lbl">Référence</span><span class="info-val" style="font-family:monospace">${p.ref||''}</span></div>
      <div class="info-row"><span class="info-lbl">Dernière vérif.</span><span class="info-val" style="${p.verifieLe?'':'color:var(--text3)'}">${p.verifieLe?fmtHD(p.verifieLe):'Jamais'}</span></div>
    </div>
    ${cm}
    ${histoSection}
    <button class="btn-del" onclick="deletePart('${p.id}')">🗑 Supprimer cette pièce</button>`;
  renderDetailNav();
  return true;
}

// Barre Précédent/Suivant : suit la liste affichée (inventaire filtré ou recherche).
function renderDetailNav() {
  const bar = document.getElementById('detail-nav');
  if (!bar) return;
  const i = navIds.indexOf(curPartId);
  if (i < 0 || navIds.length < 2) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const prev = i > 0 ? navIds[i-1] : null;
  const next = i < navIds.length - 1 ? navIds[i+1] : null;
  bar.innerHTML =
    `<button class="dnav-btn" ${prev?'':'disabled'} ${prev?`onclick="showDetail('${prev}',prevScreen)"`:''}>‹ Précédent</button>`+
    `<span class="dnav-pos">${i+1} / ${navIds.length}</span>`+
    `<button class="dnav-btn" ${next?'':'disabled'} ${next?`onclick="showDetail('${next}',prevScreen)"`:''}>Suivant ›</button>`;
}

// ═══════════════════════════════════════════════════════
// ADD FORM
// ═══════════════════════════════════════════════════════
function resetAdd() {
  ['a-model','a-notes','a-brand-other','a-type-other'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  curCond=null; curBrand=null; curType=null; editPartId=null; photos=[null,null,null,null]; editExtraPhotos=[];
  { const pl=document.getElementById('photo-lbl'); if(pl) pl.textContent='Photos (max 4)'; }
  document.querySelectorAll('.cond-btn').forEach(b=>b.className='cond-btn');
  document.querySelectorAll('.brand-btn[data-brand]').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('on'));
  resetSlot(0); resetSlot(1); resetSlot(2); resetSlot(3);
  document.getElementById('compat-sec').style.display='none';
  document.getElementById('compat-list').innerHTML='';
  document.getElementById('ref-preview').classList.remove('show');
  const hdr=document.querySelector('#screen-add .hdr-title'); if(hdr) hdr.textContent='Ajouter une pièce';
  const btn=document.getElementById('save-btn'); if(btn) btn.textContent='Enregistrer la pièce';
}
function selBrand(brand, el) {
  curBrand = brand;
  document.querySelectorAll('.brand-btn[data-brand]').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('a-brand-other').value = '';
  onBMChange(); updateRefPreview();
}
function selBrandOther(val) {
  if (!val) return;
  curBrand = val;
  document.querySelectorAll('.brand-btn[data-brand]').forEach(b=>b.classList.remove('on'));
  onBMChange(); updateRefPreview();
}
function selType(type, el) {
  curType = type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('a-type-other').value = '';
  updateRefPreview();
}
function selTypeOther(val) {
  if (!val) return;
  curType = val;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('on'));
  updateRefPreview();
}
function updateRefPreview() {
  const model = document.getElementById('a-model').value.trim();
  const prev  = document.getElementById('ref-preview');
  const val   = document.getElementById('ref-preview-val');
  if (curBrand && model && curType) {
    const ref = editPartId
      ? (allParts.find(p=>p.id===editPartId)?.ref || genRef(curBrand,model,curType))
      : genRef(curBrand, model, curType);
    val.textContent = ref;
    prev.classList.add('show');
  } else {
    prev.classList.remove('show');
  }
}
function showEditForm(id) {
  const p = allParts.find(x=>x.id===id); if (!p) return;
  prevScreen = 'detail';
  editPartId = id;
  resetAdd();
  editPartId = id; // resetAdd l'efface, on le remet
  // Brand
  const brandBtn = document.querySelector(`.brand-btn[data-brand="${p.brand}"]`);
  if (brandBtn) { curBrand=p.brand; brandBtn.classList.add('on'); }
  else { curBrand=p.brand; document.getElementById('a-brand-other').value=p.brand; }
  // Model
  document.getElementById('a-model').value = p.model||'';
  // Type
  const typeBtn = document.querySelector(`.type-btn[data-type="${p.type}"]`);
  if (typeBtn) { curType=p.type; typeBtn.classList.add('on'); }
  else { curType=p.type; document.getElementById('a-type-other').value=p.type; }
  // Condition
  if (p.condition) selCond(p.condition);
  // Notes
  document.getElementById('a-notes').value = p.notes||'';
  // Photos
  photos = [null, null, null, null];
  (p.photos||[]).forEach((src,i)=>{ if(i>3)return; photos[i]=src; const s=document.getElementById('ps'+i); s.innerHTML=`<img src="${src}" alt="" style="cursor:pointer" onclick="openLb('${src}')"><div class="photo-del" onclick="rmPhoto(${i},event)">✕</div><input type="file" id="pi${i}" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(${i},this)">`; });
  editExtraPhotos = (p.photos||[]).slice(4);   // photos 5+ conservées telles quelles
  { const pl=document.getElementById('photo-lbl'); if(pl) pl.textContent = editExtraPhotos.length ? `Photos (4 modifiables · +${editExtraPhotos.length} conservée${editExtraPhotos.length>1?'s':''})` : 'Photos (max 4)'; }
  // Header + bouton
  const hdr=document.querySelector('#screen-add .hdr-title'); if(hdr) hdr.textContent='Modifier la pièce';
  const btn=document.getElementById('save-btn'); if(btn) btn.textContent='Enregistrer les modifications';
  onBMChange();
  // Re-cocher les compatibilités sauvegardées
  if ((p.compatible||[]).length) {
    (p.compatible).forEach(m=>{
      const chk=document.querySelector(`.ccheck[data-m="${m}"]`);
      if(chk) chk.classList.add('on');
    });
  }
  updateRefPreview();
  go('add');
}
function resetSlot(i) {
  const s=document.getElementById('ps'+i), ic=i===0?'<span style="font-size:28px;color:var(--text3)">📷</span>':'<span style="font-size:26px;color:var(--text3)">+</span>';
  s.innerHTML=`${ic}<input type="file" id="pi${i}" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(${i},this)">`;
}
function selCond(v) {
  curCond=v;
  document.querySelectorAll('.cond-btn').forEach(b=>b.className='cond-btn');
  const map={ok:'c-ok',partial:'c-par',broken:'c-hs'};
  document.querySelector(`.cond-btn[data-v="${v}"]`).classList.add(map[v]);
}
function trigPhoto(i) { document.getElementById('pi'+i).click(); }
async function onPhoto(i,inp) {
  const f=inp.files[0]; if (!f) return;
  const s=document.getElementById('ps'+i);
  // 1) Redimensionne en aperçu local
  const d = await new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'), MAX=1000; let w=img.width,h=img.height; if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}} c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',.8)); }; img.src=e.target.result; };
    r.readAsDataURL(f);
  });
  // Aperçu immédiat (légèrement grisé pendant l'envoi)
  s.innerHTML=`<img src="${d}" alt="" style="opacity:.5"><div class="photo-del" onclick="rmPhoto(${i},event)">✕</div>`;
  // 2) Upload Cloudinary → on ne garde QUE l'URL
  try {
    const url = await uploadCloudinary(d);
    photos[i]=url;
    s.innerHTML=`<img src="${optim(url,500)}" alt="" style="cursor:pointer" onclick="openLb('${url}')"><div class="photo-del" onclick="rmPhoto(${i},event)">✕</div><input type="file" id="pi${i}" accept="image/*" style="display:none" onchange="onPhoto(${i},this)">`;
  } catch(err) {
    photos[i]=null; resetSlot(i); toast("⚠️ Échec de l'envoi de la photo, réessaie"); console.error(err);
  }
}
function rmPhoto(i,e) { e.stopPropagation(); photos[i]=null; resetSlot(i); }
function onBMChange() {
  const brand=curBrand||'', model=document.getElementById('a-model').value.trim();
  const opts=(COMPAT[brand]||{})[model]||[], sec=document.getElementById('compat-sec'), lst=document.getElementById('compat-list');
  if (!opts.length) { sec.style.display='none'; return; }
  sec.style.display='block';
  lst.innerHTML=opts.map(m=>`<div class="ccheck" data-m="${m}" onclick="this.classList.toggle('on')">${m}</div>`).join('');
}

// ═══════════════════════════════════════════════════════
// SMART SEARCH
// ═══════════════════════════════════════════════════════
function smartSearch() {
  const query=document.getElementById('sq').value.trim().toLowerCase(), out=document.getElementById('sr');
  if (!query) return;
  if (!allParts.length) { out.innerHTML='<div class="empty"><div class="empty-ttl">Inventaire vide</div></div>'; return; }
  const tokens=query.split(/\s+/).filter(t=>t.length>1);
  const scored=allParts.map(p=>{
    let s=0; const txt=[p.brand,p.model,p.type,p.notes,p.ref,...(p.compatible||[])].map(x=>(x||'').toLowerCase()).join(' ');
    const txtC=txt.replace(/[^a-z0-9]/g,'');   // recherche de réf sans séparateurs
    tokens.forEach(tk=>{ const tkc=tk.replace(/[^a-z0-9]/g,''); if(!txt.includes(tk) && !(tkc.length>=2 && txtC.includes(tkc)))return; s+=2; if((p.model||'').toLowerCase().includes(tk))s+=4; if((p.type||'').toLowerCase().includes(tk))s+=3; if((p.brand||'').toLowerCase().includes(tk))s+=2; if((p.compatible||[]).some(c=>c.toLowerCase().includes(tk)))s+=1; });
    if(!s && correspond(txt,query)) s=2;   // mots mélangés / collés
    if(p.condition==='ok')s+=.5; return {p,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  navIds = scored.map(x=>x.p.id);   // ordre pour Précédent/Suivant
  if (!scored.length) { out.innerHTML='<div class="empty"><div class="empty-ico">🤔</div><div class="empty-ttl">Aucun résultat</div><div class="empty-dsc">Essaie d\'autres termes.</div></div>'; return; }
  const mx=scored[0].s;
  out.innerHTML=`<div class="sec-lbl">${scored.length} résultat${scored.length>1?'s':''}</div>`+scored.map(({p,s})=>{
    const ok=s>=mx*.75;
    return `<div class="res-card ${ok?'res-perfect':'res-close'}${p.id===curPartId?' sel':''}" data-id="${p.id}" onclick="showDetail('${p.id}','search')">
      ${cardIc(p)}
      <div class="pcard-info">
        <div class="res-match">${ok?'✓ Correspondance parfaite':'~ Correspondance proche'}</div>
        <div class="pcard-ref">${p.ref||''}</div>
        <div class="pcard-name">${p.type} — ${p.model}</div>
        <div class="pcard-sub">${p.brand}${p.notes?' · '+p.notes.slice(0,40)+(p.notes.length>40?'…':''):''}</div>
      </div>
      <span class="badge ${bCls(p.condition)}">${bLbl(p.condition)}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// THÈME (mêmes couleurs que StockVault) + RACCOURCIS CLAVIER
// ═══════════════════════════════════════════════════════
function syncThemeBtns() {
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  const s=document.getElementById('side-theme'); if(s) s.textContent = dark ? '☀️ Clair' : '🌙 Sombre';
  const i=document.getElementById('inv-theme'); if(i) i.textContent = dark ? '☀️' : '🌙';
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark ? '#262c4f' : '#eef1f7');
}
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme')!=='dark';
  if (dark) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('ps_theme', dark?'dark':'light'); } catch(e) {}
  syncThemeBtns();
}
syncThemeBtns();

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase(), typing = tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if (e.key==='Escape') {
    if (document.getElementById('lb').classList.contains('open')) { closeLb(); return; }
    if (typing) { e.target.blur(); return; }
    if (isDesk() && document.getElementById('screen-detail').classList.contains('open')) { closeDetailPanel(); return; }
    if (mainScreen==='add') { editPartId=null; go('inventory'); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='/') { e.preventDefault(); const q=document.getElementById(isDesk()?'side-q':'inv-q'); if(!isDesk()&&mainScreen!=='inventory') go('inventory'); q&&q.focus(); return; }
  if ((e.key==='ArrowRight'||e.key==='ArrowLeft') && curPartId && (document.getElementById('screen-detail').classList.contains('open')||document.getElementById('screen-detail').classList.contains('active'))) {
    const i=navIds.indexOf(curPartId), j=i+(e.key==='ArrowRight'?1:-1);
    if (i>=0 && j>=0 && j<navIds.length) { e.preventDefault(); showDetail(navIds[j], prevScreen); }
  }
});

function bLbl(c) { return {ok:'OK',partial:'Partiel',broken:'HS'}[c]||'OK'; }
function bCls(c) { return {ok:'b-ok',partial:'b-par',broken:'b-hs'}[c]||'b-ok'; }
function openLb(src) { document.getElementById('lb-img').src=src; document.getElementById('lb').classList.add('open'); }
function closeLb()   { document.getElementById('lb').classList.remove('open'); }
let _tt; function toast(m) { const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>e.classList.remove('show'),2600); }
</script>
